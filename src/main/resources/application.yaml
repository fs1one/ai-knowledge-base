server:
  port: 8081          # 避开 8080（book-system 可能占着）

spring:
  application:
    name: ai-knowledge-base
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/ai_knowledge_base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    # 密码不写死在这里 —— 这里会进 Git。用环境变量，在 IDEA 运行配置里设 DB_PASSWORD
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 把 SQL 打到控制台，学习阶段有用；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
