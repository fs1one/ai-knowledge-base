server:
  port: 8081          # 避开 8080（book-system 可能占着）

spring:
  application:
    name: ai-knowledge-base
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/ai_knowledge_base?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    # 密码不写死在这里 —— 这里会进 Git。用环境变量，在 IDEA 运行配置里设 DB_PASSWORD
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

app:
  upload-dir: ./uploads
  index-strategy: paragraph
  index-dir: ./index
  embedding:
    provider: ollama
    ollama:
      base-url: http://localhost:8090
      model: bge-small-zh
  qa:
    top-k: 3                # 检索几块进上下文，块长 400 时 3 块约 1100 字，够用且不超模型上下文
    max-tokens: 512         # LLM 最多生成多少 token，512 约 300 字
    max-context-chars: 2000 # 拼进 prompt 的字符上限，防止超上下文
  llm:
    base-url: http://localhost:8091

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 把 SQL 打到控制台，学习阶段有用；上线要关掉
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
